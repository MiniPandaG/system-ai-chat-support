server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    server_tokens off;
    # 5 adjuntos de 10 MB por mensaje más el texto; debe coincidir con post_max_size de docker/php/php.ini.
    client_max_body_size 56m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Los archivos estáticos no pasan por Laravel, así que llevan aquí su cabecera.
    location /build/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri =404;
    }

    # El script que las empresas pegan en su sitio. Se carga desde páginas de otros orígenes, así que a diferencia del resto
    # puede leerse desde fuera; la dirección no lleva versión, por eso la caché es corta.
    location = /widget.js {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    # Tiempo real: solo la conexión del navegador (/app/{llave}). La API HTTP de Reverb (/apps/…), con la que la aplicación
    # publica eventos, no se expone: nadie de fuera puede emitir. El destino va en una variable para que nginx arranque
    # aunque Reverb no esté levantado.
    location /app/ {
        resolver 127.0.0.11 valid=10s;
        set $reverb http://reverb:8080;
        proxy_pass $reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Más largo que el ping de Reverb (60 s), para que nginx no corte una conexión que solo está en silencio.
        proxy_read_timeout 120s;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
