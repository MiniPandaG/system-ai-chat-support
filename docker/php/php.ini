expose_php = Off
display_errors = Off
log_errors = On
error_reporting = E_ALL
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 12M
session.cookie_httponly = 1
session.use_strict_mode = 1
; En Docker sobre Windows cada comprobación de fechas recorre miles de archivos montados y tarda segundos.
; Por eso no se comprueban: tras editar PHP hay que recargar con: docker compose exec app kill -USR2 1
opcache.validate_timestamps=0
opcache.memory_consumption=192
opcache.max_accelerated_files=20000
