expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
memory_limit = 256M
upload_max_filesize = 10M
; Un mensaje admite hasta 5 adjuntos de 10 MB más el texto: 5 × 10 MB + margen. nginx lo repite en client_max_body_size.
post_max_size = 56M
max_file_uploads = 10
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1
; El código de la imagen no cambia mientras el contenedor vive: no se comprueban fechas. Cada despliegue es una imagen nueva.
opcache.validate_timestamps=0
opcache.memory_consumption=192
opcache.max_accelerated_files=20000
