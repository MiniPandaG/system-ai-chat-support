# Plantilla para el nginx DEL VPS (no el de Docker). Pone el HTTPS y le pasa el tráfico al servicio «web» del compose, que solo
# escucha en 127.0.0.1:8081. Cambia soporte.tudominio.com por tu dominio y guarda esto en /etc/nginx/sites-available/geckochat.
#
# Certificado con certbot (una vez, con el dominio ya apuntando al VPS):
#   sudo certbot certonly --nginx -d soporte.tudominio.com
# certbot instala su propia renovación automática (systemd timer): comprueba con «sudo certbot renew --dry-run».

server {
    listen 80;
    listen [::]:80;
    server_name soporte.tudominio.com;

    # certbot renueva por aquí; todo lo demás va a https.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name soporte.tudominio.com;

    ssl_certificate /etc/letsencrypt/live/soporte.tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/soporte.tudominio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    server_tokens off;
    # 5 adjuntos de 10 MB por mensaje más el texto; debe coincidir con post_max_size de PHP y con el nginx de Docker.
    client_max_body_size 56m;

    # HSTS lo pone la aplicación (solo cuando sabe que la petición llegó por https), así que aquí no se repite.

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # La aplicación cree estas dos cabeceras solo de quien esté en TRUSTED_PROXIES (la red de Docker).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Tiempo real (WebSockets): el mismo destino, con el cambio de protocolo.
    location /app/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
