; Pool de PHP-FPM de producción. El de fábrica admite 5 procesos a la vez: con unos pocos agentes en la bandeja se forma cola y la
; latencia se dispara (medido en entregas/m13/carga.md). Cada proceso usa unos 40 MB y tiene tope de 256 MB (memory_limit).
; Con 10 procesos la aplicación usa como mucho unos 400 MB, lo que cabe en un VPS de 2 a 4 GB (con 10 agentes la bandeja respondió bien en el ensayo con 24; ajusta esto a la memoria real y mide).
[www]
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
; Reinicia cada proceso tras 500 peticiones para que ninguna fuga de memoria se acumule.
pm.max_requests = 500
; Una petición que cuelga no retiene un proceso para siempre.
request_terminate_timeout = 60s
